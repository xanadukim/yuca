<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- 배경 원 -->
  <circle cx="120" cy="120" r="110" fill="#E8F5E9" />
  <path d="M 35 190 Q 120 180 205 190" stroke="#81C784" stroke-width="4" fill="none" stroke-linecap="round" />

  <!-- 즐거운 분위기를 나타내는 음표 및 반짝임 -->
  <path d="M 105 45 L 105 32 L 115 30 L 115 43" stroke="#FFB300" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="102" cy="45" r="3" fill="#FFB300" />
  <circle cx="112" cy="43" r="3" fill="#FFB300" />
  <path d="M 185 85 L 188 78 L 191 85 L 198 88 L 191 91 L 188 98 L 185 91 L 178 88 Z" fill="#FFCA28" />

  <!-- 산책하는 사람 -->
  <g id="person" stroke="#2C3E50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 뒤쪽 팔 -->
    <path d="M 75 95 L 60 115" stroke="#546E7A" />
    <!-- 뒤쪽 다리 -->
    <path d="M 75 135 L 62 162 L 52 185" stroke="#546E7A" />
    <!-- 앞쪽 다리 (경쾌하게 걷는 모습) -->
    <path d="M 80 135 L 95 160 L 105 182" />
    <!-- 몸통 -->
    <path d="M 78 90 L 78 135" stroke-width="14" stroke="#FF7043" />
    <!-- 머리 -->
    <circle cx="78" cy="68" r="13" fill="#FFCCBC" stroke="none" />
    <!-- 웃는 표정 및 머리카락 -->
    <path d="M 66 64 Q 78 50 90 64" fill="#37474F" stroke="none" />
    <path d="M 82 70 Q 86 74 90 70" stroke="#2C3E50" stroke-width="2.5" />
    <!-- 앞쪽 팔 (목줄을 잡은 손) -->
    <path d="M 80 95 L 100 115 L 112 110" />
  </g>

  <!-- 목줄 (Leash) -->
  <path d="M 112 110 Q 132 135 150 135" stroke="#E53935" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- 신나게 뛰어가는 강아지 -->
  <g id="dog">
    <!-- 흔들리는 꼬리 -->
    <path d="M 140 148 Q 130 132 136 125" stroke="#D84315" stroke-width="5" fill="none" stroke-linecap="round" />
    <!-- 꼬리 흔들림 효과선 -->
    <path d="M 126 135 Q 123 128 128 123" stroke="#FFB300" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- 뒤쪽 다리 -->
    <path d="M 145 162 L 138 182" stroke="#BF360C" stroke-width="5" stroke-linecap="round" />
    <!-- 앞쪽 다리 -->
    <path d="M 168 162 L 178 180" stroke="#D84315" stroke-width="5" stroke-linecap="round" />
    <!-- 몸통 -->
    <rect x="138" y="142" width="36" height="22" rx="11" fill="#FF8A65" />
    <!-- 목줄 카라 -->
    <line x1="166" y1="138" x2="173" y2="148" stroke="#E53935" stroke-width="4" stroke-linecap="round" />
    <!-- 머리 -->
    <circle cx="174" cy="136" r="12" fill="#FF8A65" />
    <!-- 주둥이 & 코 -->
    <ellipse cx="184" cy="138" rx="6" ry="4.5" fill="#FFCCBC" />
    <circle cx="188" cy="136" r="2.5" fill="#2C3E50" />
    <!-- 펄럭이는 귀 -->
    <path d="M 166 128 Q 156 126 158 138 Q 164 140 168 133 Z" fill="#BF360C" />
    <!-- 웃는 눈 & 내민 혀 -->
    <path d="M 175 132 Q 178 129 181 132" stroke="#2C3E50" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 183 142 Q 186 148 189 142" fill="#FF5252" />
  </g>
</svg>

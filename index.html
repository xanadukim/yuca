<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YUCA v8.9.6 Professional</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./assets/mascot.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="./css/duolingo.css?v=8.9.6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        height: 100vh;
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #sidebar {
        width: 186px;
        background: #ffffff;
        color: #3c3c3c;
        padding: 18px 14px;
        overflow: auto;
        scrollbar-width: none;
        flex-shrink: 0;
        border-right: 2px solid #e5e5e5;
      }
      #sidebar::-webkit-scrollbar { display: none; }
      #sidebar .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 2px 6px;
      }
      #sidebar .logo img {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: #fff;
        padding: 2px;
        border: 2px solid #e5e5e5;
      }
      #sidebar .logo b {
        font-size: 36px;
        letter-spacing: -1.5px;
        color: #58cc02;
      }
      #sidebar small {
        color: #a0aec0;
        margin-left: 48px;
        font-size: 11px;
        font-weight: 700;
      }
      #main-content {
        flex: 1;
        overflow: auto;
        background: #ffffff;
        padding: 20px 24px;
      }
      #sidebar-nav {
        margin-top: 14px;
      }
      #sidebar-nav button:hover {
        background: #f7f7f7 !important;
        color: #3c3c3c !important;
      }
    </style>
  </head>
  <body>
    <aside id="sidebar">
      <div class="logo">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="#58cc02"><ellipse cx="12" cy="15.8" rx="4.6" ry="3.9"/><circle cx="6.6" cy="10.2" r="1.9"/><circle cx="10" cy="7.6" r="1.9"/><circle cx="14" cy="7.6" r="1.9"/><circle cx="17.4" cy="10.2" r="1.9"/></svg><b>YUCA</b>
      </div>
      <nav id="sidebar-nav"></nav>
      <div id="sbTools" style="display:flex;gap:6px;margin-top:16px">
        <button onclick="YUCA_toggleSidebar()" title="사이드바 접기" style="flex:1;padding:7px;border:1px solid #e5e5e5;background:#fff;border-radius:8px;cursor:pointer;font-size:13px;color:#777">«</button>
        <button id="themeBtn" onclick="YUCA_toggleTheme()" title="저녁모드" style="flex:1;padding:7px;border:1px solid #e5e5e5;background:#fff;border-radius:8px;cursor:pointer;font-size:14px">🌙</button>
      </div>
      <div id="logout-slot"></div>
    </aside>
    <main id="main-content"></main>
    <script type="module" src="./js/app.js?v=8.9.6"></script>
  </body>
</html>
